name: Deploy to GitHub Pages

# Every push to `main` deploys, but only after the CI quality gate passes
# (plans/fazlar/faz-5-yayin-ve-dagitim.md §2 task 2).
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  ASTRO_TELEMETRY_DISABLED: 1

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  quality-gate:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build and upload site
        uses: withastro/action@v6
        with:
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
